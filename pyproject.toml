[project]
name = "rag-incident-lab"
version = "0.1.0"
description = "Support-agent RAG layer for a hypothetical managed-Kubernetes vendor, subjected to seven scripted production incidents"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "psycopg[binary]==3.3.4",
    "pgvector==0.5.0",
    "fastembed==0.8.0",
    "gitpython==3.1.59",
    "httpx==0.28.1",
    "boto3==1.43.71",
    "pydantic==2.13.4",
    "prometheus-client==0.26.0",
    "python-frontmatter==1.3.0",
    "pyarrow==25.0.1",
    "psycopg-pool==3.3.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
